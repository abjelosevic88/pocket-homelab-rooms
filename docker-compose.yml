# Pocket Rooms (Go + SQLite) — plan your rooms to scale: floor plans, furniture by its real size, layouts in 2D and 3D, clearance checks and will-it-fit-through-the-door. One container, one volume.
services:
  pocket-rooms:
    image: ghcr.io/abjelosevic88/pocket-homelab-rooms:latest
    container_name: pocket-rooms
    restart: unless-stopped
    ports:
      - "8080:8080"
    environment:
      TZ: ${TZ:-Europe/Berlin}
      BASE_URL: ${BASE_URL:-http://localhost:8080}
      # SECURE_COOKIES: "true"          # behind HTTPS
      # First admin (only used while the database has no users):
      ADMIN_EMAIL: ${ADMIN_EMAIL:-}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:-}
      NOTIFY_URL: ${NOTIFY_URL:-}
      # Pocket Core: one sign-in, Pocket AI, and app links to Pocket Home, Inventory, Wishlist, Photos, Tasks, Notes, Files, Money, Rentals and Chat.
      # CORE_URL: http://pocket-core:8080
      # CORE_REGISTRATION_KEY: ${CORE_REGISTRATION_KEY}
    volumes:
      - ./data:/data
    extra_hosts:
      - "host.docker.internal:host-gateway"
